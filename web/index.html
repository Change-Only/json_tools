<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>JSON 工具箱</title>
  <!-- 内联空 favicon，避免 file:// 下 404 控制台报错 -->
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div id="app">
    <noscript>本工具需要启用 JavaScript 才能使用。</noscript>
  </div>

  <!-- 离线依赖包（esbuild 打包的 IIFE，暴露 globalThis.JSONToolboxLibs） -->
  <script src="vendor/libs.js"></script>

  <!-- 纯逻辑层：加载时不触碰 DOM -->
  <script src="js/core/json.js"></script>
  <script src="js/core/convert.js"></script>
  <script src="js/core/codegen.js"></script>
  <script src="js/core/codec.js"></script>
  <script src="js/core/analyze.js"></script>

  <!-- UI 层 -->
  <script src="js/ui/dom.js"></script>
  <script src="js/ui/toast.js"></script>
  <script src="js/ui/storage.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/ui/editor.js"></script>

  <!-- 工具注册表 -->
  <script src="js/tools-registry.js"></script>

  <!-- 装配层 -->
  <script src="js/app.js"></script>
</body>
</html>
